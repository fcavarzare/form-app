name: cd-form-app-prod

on:
  push:
    branches: ["prod"]

permissions:
  contents: write

env:
  IMAGE_NAME: fcavarzare/form-app

jobs:
  deploy_prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prod
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Update PROD deployment image (auto SHA)
        run: |
          set -e
          SHA="${{ github.sha }}"
          sed -i "s|image: .*|image: ${{ env.IMAGE_NAME }}:${SHA}|g" deploy/prod/deployment.yaml

      - name: Commit and push PROD manifest
        run: |
          set -e
          SHA="${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/prod/deployment.yaml
          git commit -m "chore(prod): update image to ${SHA}" || exit 0
          git pull --rebase origin prod
          git push