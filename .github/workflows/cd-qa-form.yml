name: cd-form-app-qa

on:
  push:
    branches: ["main"]
    paths:
      - "qa/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy_qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show QA image (debug)
        shell: bash
        run: |
          echo "QA deployment image:"
          awk '$1=="image:"{print; exit}' qa/deployment.yaml