name: ci-form-app

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"

permissions:
  contents: write

env:
  IMAGE_NAME: fcavarzare/form-app

jobs:
  build_push_and_update_dev:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Update DEV manifest to SHA
        shell: bash
        run: |
          set -euo pipefail
          DEV_FILE="deploy/dev/deployment.yaml"
          NEW_IMAGE="${IMAGE_NAME}:${GITHUB_SHA}"

          [[ -f "$DEV_FILE" ]] || { echo "ERROR: $DEV_FILE not found"; exit 1; }

          awk -v new_image="$NEW_IMAGE" '
            BEGIN{done=0}
            {
              if(!done && $1=="image:"){
                match($0, /^[[:space:]]*/)
                indent=substr($0, RSTART, RLENGTH)
                print indent "image: " new_image
                done=1
              } else print
            }
          ' "$DEV_FILE" > "$DEV_FILE.tmp" && mv "$DEV_FILE.tmp" "$DEV_FILE"

          echo "DEV image now:"
          awk '$1=="image:"{print; exit}' "$DEV_FILE"

      - name: Commit & push DEV update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deploy/dev/deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(dev): set image ${GITHUB_SHA} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main