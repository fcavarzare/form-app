name: promote-qa-to-prod

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote QA image (SHA) to PROD
        shell: bash
        run: |
          set -euo pipefail

          QA_FILE="deploy/qa/deployment.yaml"
          PROD_FILE="deploy/prod/deployment.yaml"

          [[ -f "$QA_FILE" ]] || { echo "ERROR: missing $QA_FILE"; exit 1; }
          [[ -f "$PROD_FILE" ]] || { echo "ERROR: missing $PROD_FILE"; exit 1; }

          QA_IMAGE="$(awk '$1=="image:"{print $2; exit}' "$QA_FILE")"
          PROD_BEFORE="$(awk '$1=="image:"{print $2; exit}' "$PROD_FILE")"

          echo "QA   image: $QA_IMAGE"
          echo "PROD before: $PROD_BEFORE"

          [[ -n "${QA_IMAGE:-}" ]] || { echo "ERROR: QA image not found"; exit 1; }

          if [[ "$QA_IMAGE" == *":latest" || "$QA_IMAGE" == *":CHANGE_ME" ]]; then
            echo "ERROR: QA must be a SHA tag to promote. Current: $QA_IMAGE"
            exit 1
          fi

          awk -v new_image="$QA_IMAGE" '
            BEGIN{done=0}
            {
              if(!done && $1=="image:"){
                match($0, /^[[:space:]]*/)
                indent=substr($0, RSTART, RLENGTH)
                print indent "image: " new_image
                done=1
              } else print
            }
          ' "$PROD_FILE" > "$PROD_FILE.tmp" && mv "$PROD_FILE.tmp" "$PROD_FILE"

          PROD_AFTER="$(awk '$1=="image:"{print $2; exit}' "$PROD_FILE")"
          echo "PROD after:  $PROD_AFTER"

      - name: Commit & push PROD promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deploy/prod/deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(prod): promote image from qa [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main