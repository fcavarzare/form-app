name: promote-dev-to-qa

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote DEV image (SHA) to QA
        shell: bash
        run: |
          set -euo pipefail

          DEV_FILE="deploy/dev/deployment.yaml"
          QA_FILE="deploy/qa/deployment.yaml"

          [[ -f "$DEV_FILE" ]] || { echo "ERROR: missing $DEV_FILE"; exit 1; }
          [[ -f "$QA_FILE" ]] || { echo "ERROR: missing $QA_FILE"; exit 1; }

          DEV_IMAGE="$(awk '$1=="image:"{print $2; exit}' "$DEV_FILE")"
          QA_BEFORE="$(awk '$1=="image:"{print $2; exit}' "$QA_FILE")"

          echo "DEV image: $DEV_IMAGE"
          echo "QA  before: $QA_BEFORE"

          [[ -n "${DEV_IMAGE:-}" ]] || { echo "ERROR: DEV image not found"; exit 1; }

          if [[ "$DEV_IMAGE" == *":latest" || "$DEV_IMAGE" == *":CHANGE_ME" ]]; then
            echo "ERROR: DEV must be a SHA tag to promote. Current: $DEV_IMAGE"
            exit 1
          fi

          awk -v new_image="$DEV_IMAGE" '
            BEGIN{done=0}
            {
              if(!done && $1=="image:"){
                match($0, /^[[:space:]]*/)
                indent=substr($0, RSTART, RLENGTH)
                print indent "image: " new_image
                done=1
              } else print
            }
          ' "$QA_FILE" > "$QA_FILE.tmp" && mv "$QA_FILE.tmp" "$QA_FILE"

          QA_AFTER="$(awk '$1=="image:"{print $2; exit}' "$QA_FILE")"
          echo "QA  after:  $QA_AFTER"

      - name: Commit & push QA promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deploy/qa/deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(qa): promote image from dev [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main