apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: form-app-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fcavarzare/FORM-APP.git
    targetRevision: qa
    path: deploy/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: form-app-qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true