apiVersion: apps/v1
kind: Deployment
metadata:
  name: form-app
  namespace: form-app-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: form-app
  template:
    metadata:
      labels:
        app: form-app
    spec:
      containers:
        - name: form-app
          image: fcavarzare/form-app:34e0375dc8a2270cbf866b6d02f0e650d96ac08c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_SERVER
              valueFrom:
                secretKeyRef:
                  name: form-app-db
                  key: DB_SERVER
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: form-app-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: form-app-db
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: form-app-db
                  key: DB_NAME
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            
