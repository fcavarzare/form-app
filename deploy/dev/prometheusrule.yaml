apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: form-app
  namespace: form-app-dev
  labels:
    release: kps
    app: form-app
spec:
  selector:
    matchLabels:
      app: form-app
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: form-app-dev-alerts
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
  - name: form-app.dev.rules
    rules:
    - alert: FormAppDevHighCpu
      expr: |
        sum by (pod) (
          rate(container_cpu_usage_seconds_total{namespace="form-app-dev", container="form-app"}[5m])
        ) > 0.20
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "CPU alta em DEV"
        description: "Pod {{ $labels.pod }} usando > 200m de CPU"
    - alert: FormAppDevHighMemory
      expr: |
        container_memory_working_set_bytes{namespace="form-app-dev", container="form-app"} > 300 * 1024 * 1024
      for: 3m
      labels:
        severity: warning
    - alert: FormAppDevRestarting
      expr: |
        increase(kube_pod_container_status_restarts_total{namespace="form-app-dev", container="form-app"}[10m]) > 1
      for: 1m
      labels:
        severity: warning
    - alert: FormAppDevNotReady
      expr: |
        kube_pod_status_ready{namespace="form-app-dev", condition="true"} == 0
      for: 2m
      labels:
        severity: critical
