apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: form-app-hpa
  namespace: form-app-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: form-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70