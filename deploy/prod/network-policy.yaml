apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: form-app-allow-ingress-and-monitoring
  namespace: form-app-prod
spec:
  podSelector:
    matchLabels:
      app: form-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
  - to:
    - ipBlock:
        cidr: 100.100.100.104/32
    ports:
    - protocol: TCP
      port: 1433
